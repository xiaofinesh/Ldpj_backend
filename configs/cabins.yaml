# 各真空舱有效体积 V_cabin 标定值
# 单位: m³ (= 立方米); 注水法测量(盖瓶盖口径), 通常在 [2.0e-4, 2.4e-4] 区间
# Cabin[0] 为预留, 不参与
# u_v_cabin 为标定不确定度 (1-sigma, 单位 m³)
#
# 数据来源: 2026-06-05 终版标定 (茅台酒瓶 500mL 灌装态)。
#   原始: 舱室间隙V_Cabin测量结果.xlsx(注水法); 取整到 mL。
#   自洽性: k_ts = |β|/V_cabin 中位 ≈ 1014 (理论 1000, +1.4%), 跨舱 CV 0.3%
#           —— β(m1_coefficients.json) 与 V_cabin 物理一致。
#   舱24: 盖瓶盖实测 215 mL → 开盖修正 +10 = 225 mL (用户 6/5 提供)。
# 注: V_cabin 已隐含于 M1 的 β 中, 推理时不直接用; 此表供重标定与追溯。

calibration_date: "2026-06-05"
calibrator: "标定组"

cabins:
