enabled: true
check_interval_s: 60

checks:
  plc_connection:
    enabled: true
    timeout_s: 5
  model_loaded:
    enabled: true
  disk_space:
    enabled: true
    min_free_mb: 100
  inference_latency:
    enabled: true
    max_ms: 500
  data_integrity:
    enabled: true
    pressure_range: [0, 2000]
    min_pressure_points: 2
  polling_thread:
    enabled: true
  fsm_stuck:
    enabled: true
    max_stuck_duration_s: 120
  database:
    # F007 fires when DB exceeds warn_fraction × max_size_mb (default 0.9 × 1000 = 900 MB).
    # Tune to fit edge-device storage + retention policy.
    max_size_mb: 1000
    warn_fraction: 0.9

fault_report:
  log_to_file: true
  write_to_plc: true
