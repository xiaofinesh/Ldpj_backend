# 运行时参数配置 (v2.6.2)
#
# 压力标度: 0 = 常压, ~600 = 满真空 (正值真空度)
# 角度标度: RT_Angle 0~360°, 每工位 14.4°
#
# v2.6 引入"配方系统"(cycle_profiles): 一个 profile 描述特定产量档位下的全部时序参数。
# 当前只填一档(13000 瓶/小时,周期 6900ms),未来可扩展或改为从 PLC 读取。

logging:
  level: INFO
  file: ldpj_backend.log
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  rotate:
    max_bytes: 5242880
    backup_count: 5

# ── 标签定义 ────────────────────────────────────────────────
# label =  1: OK   (正常)
# label =  0: LEAK (漏液)
# label = -1: N/A  (模型未加载或异常)
# label = -2: NO_BOTTLE (无瓶子, max < 50)

# ── 周期配方系统 ────────────────────────────────────────────
active_profile: "bph_13000"

cycle_profiles:
  bph_13000:
    description: "13000 瓶/小时, 周期 6900ms"
    bph: 13000
    cycle_total_ms: 6900

    # 5 段角度边界(°),按转盘 0°~360° 划分
    # 段名 → [起始角度, 结束角度)
    # 边界来自 131808 真实数据 4 个转折点的 mode:
    #   evac_start mode  = 75°    (压力首次脱离 0)
    #   plateau_start    = 90°    (真空到达平台)
    #   release_start    = 290°   (平台末端开始下降)
    #   release_end      = 304°   (压力归零)
    # v2.6 的 stable 段 (93°-115°) 已合并到 hold —— 112936 数据显示
    # 74°-100° 与 100°-290° 斜率比 = 1.00, 同段无瞬态。
    sections:
      baseline_pre:  [0.0,   75.0]    # 瓶进、压紧、常压基线
      evac:          [75.0,  90.0]    # 抽真空段 (压力 0 → 真空平台)
      hold:          [90.0,  290.0]   # ★保压检测段 (M1 主信号)
      release:       [290.0, 304.0]   # 破真空段 (平台 → 0)
      baseline_post: [304.0, 360.0]   # 瓶出、常压归零

    # 采集参数
    collection:
      trigger_angle: 0.0            # 采集触发角度(整圈起点)
      points: 70                    # 采集点数
      interval_s: 0.1               # 采样间隔(秒)
      timeout_s: 10.0               # 采集超时(秒)

    # 主信号段(M1 线性回归用此段计算 trend_slope)
    primary_section: "hold"

# ── 模型推理 ──────────────────────────────────────────────────
model_inference:
  # 系统分辨率 A (Pa·m³/s); Q_est 低于 A 时不参与判决
  a_resolution: 1.0e-5

  # M1/M2 不一致告警阈值(相对差)
  m_disagreement_threshold: 0.20

# 无瓶子判定: 压力最大值 < 此阈值 → label=-2, 跳过推理
no_bottle_threshold: 50.0

# ── 数据库 ──────────────────────────────────────────────────
database:
  path: ldpj_data.db
  # 占位值; HealthChecker 实际从 health.yaml::checks.database.max_size_mb 读取容量阈值
  max_size_mb: 1000

# ── 主循环 ──────────────────────────────────────────────────
loop_interval: 0.05
