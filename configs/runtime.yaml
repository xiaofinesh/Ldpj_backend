# 运行时参数配置 (v2.6.2)
#
# 压力标度: 0 = 常压, ~600 = 满真空 (正值真空度)
# 角度标度: RT_Angle 0~360°, 每工位 14.4°
#
# v2.6 引入"配方系统"(cycle_profiles): 一个 profile 描述特定产量档位下的全部时序参数。
# 当前只填一档(13000 瓶/小时,周期 6900ms),未来可扩展或改为从 PLC 读取。

logging:
  level: INFO
  file: ldpj_backend.log
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  rotate:
    max_bytes: 5242880
    backup_count: 5

# ── 标签定义 ────────────────────────────────────────────────
# label =  1: OK   (正常)
# label =  0: LEAK (漏液)
# label = -1: N/A  (模型未加载或异常)
# label = -2: NO_BOTTLE (无瓶子, max < 50)

# ── 周期配方系统 ────────────────────────────────────────────
active_profile: "bph_13000"

cycle_profiles:
  bph_13000:
    description: "13000 瓶/小时, 周期 6900ms"
    bph: 13000
    cycle_total_ms: 6900

    # 5 段角度边界(°),按转盘 0°~360° 划分
    # 段名 → [起始角度, 结束角度)
    #
    # ★ v2.6.2-cal20260605 终标定边界 [0/73/93/283/300/360]:
    #   保压窗 [93,283) —— 与生产 m1_coefficients.json 严格对应,务必同步。
    #   根因: 破真空起点中位 287.5°(p05 282.5°)早于原保压末点 290°,
    #   原 [90,290) 会把陡降点纳入斜率 → M1 R² 仅 0.79。
    #   敏感性(标定数据复算): 仅改末点 [90,283)→15/24 达标;
    #   仅改起点 [93,290)→0/24; 双改 [93,283)→25/25 全达标(中位 R² 0.9996)。
    #   stable 段 (v2.6 的 93°-115°) 已合并入 hold(斜率连续,无瞬态)。
    sections:
      baseline_pre:  [0.0,   73.0]    # 瓶进、压紧、常压基线
      evac:          [73.0,  93.0]    # 抽真空段 (压力 0 → 真空平台)
      hold:          [93.0,  283.0]   # ★保压检测段 (M1 主信号, 标定窗)
      release:       [283.0, 300.0]   # 破真空段 (平台 → 0)
      baseline_post: [300.0, 360.0]   # 瓶出、常压归零

    # 采集参数
    collection:
      trigger_angle: 0.0            # 采集触发角度(整圈起点)
      points: 70                    # 采集点数
      interval_s: 0.1               # 采样间隔(秒)
      timeout_s: 10.0               # 采集超时(秒)

    # 主信号段(M1 线性回归用此段计算 trend_slope)
    primary_section: "hold"

    # 真空工况(v2.6.3): 抽真空段稳定后的腔体绝压平台 + 大气压。
    # 这是"抽真空时间/最大真空度"维度在配置层的落点。当前为标定值,
    # 启动时与模型工件 operating_point 比对; 不一致 → F014(警告, M2 绝压特征失准)。
    # 注: 生产判废路径不消费它(M1 仅用斜率, 对真空不变); 仅当启用 Q↔d
    # 孔径换算(HMI 双口径)时由调用方传入 q_d_conversion。
    vacuum:
      p_chamber_pa: 35000.0     # 保压平台腔体绝压 ≈ 350 mbar abs (标定: 茅台500mL)
      p_atm_pa: 101325.0        # 大气压

# ── 模型推理 ──────────────────────────────────────────────────
model_inference:
  # 噪声门限 (Pa·m³/s): |Q_est| 低于此值 → F012(INFO) 不参与判决。
  # 这是"是否有可测信号"的下限, 远低于物理分辨率, 保证合格瓶(Q~1e-4)
  # 仍能正常判 OK; 不要把它当作 A/A_det 使用。
  a_resolution: 1.0e-5

  # 估计分辨率 A (Pa·m³/s, β=0.30): Q_est 低于 A 时估计被噪声主导。
  # 用于产品阈值强制校验 —— Q_threshold 必须 > A (见 products.yaml)。
  a_estimate: 9.0e-3

  # 检出分辨率 A_det (Pa·m³/s): POD≥99.87% 的最小可检漏率
  # (≈36 μm 薄壁圆孔 / 74 μm 毛细口径)。建议 Q_threshold ≥ A_det。
  a_det: 1.56e-2

  # M1/M2 不一致告警阈值(相对差) → 超过则 F010
  m_disagreement_threshold: 0.20

# 无瓶子判定: 压力最大值 < 此阈值 → label=-2, 跳过推理
no_bottle_threshold: 50.0

# ── 数据库 ──────────────────────────────────────────────────
database:
  path: ldpj_data.db
  # 占位值; HealthChecker 实际从 health.yaml::checks.database.max_size_mb 读取容量阈值
  max_size_mb: 1000

# ── 主循环 ──────────────────────────────────────────────────
loop_interval: 0.05
